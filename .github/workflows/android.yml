name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: APK derle
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Deneme sürümüne koy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk OrtakYasam-deneme.apk
          gh release delete deneme -y --cleanup-tag || true
          gh release create deneme OrtakYasam-deneme.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Telefonda deneme sürümü" \
            --notes "Kurulum: depodaki KURULUM.md dosyasına bak. Bu dosya her yeni derlemede otomatik güncellenir (${GITHUB_SHA::7})."
